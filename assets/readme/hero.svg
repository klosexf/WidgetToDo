<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">WidgetToDo — macOS 桌面浮窗，把 Notion 今日任务和日记装进常驻桌面的悬浮面板</title>
  <desc id="hero-desc">左侧为项目名与一句话价值，右侧为接近真实产品 UI 的浅色悬浮面板：待办/日记 tab、日期导航、番茄钟卡片、任务行与时长徽章。</desc>

  <defs>
    <filter id="panel-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1C1C1E" flood-opacity="0.10"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="0" y="0" width="380" height="320" rx="22"/>
    </clipPath>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="420" rx="20" fill="#F7F5F0"/>

  <!-- LEFT: title block -->
  <g transform="translate(64 0)">
    <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2.2" fill="#8E8E93">macOS 桌面浮窗 · NOTION 读写</text>

    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="84" font-weight="700" fill="#1C1C1E" letter-spacing="-1.5">WidgetToDo</text>

    <rect x="2" y="176" width="64" height="4" rx="2" fill="#B58A5F"/>

    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#3A3A3C">把 Notion 今日任务和当日日记，</text>
    <text x="0" y="264" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#3A3A3C">装进一块常驻桌面的悬浮面板。</text>

    <text x="0" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#8E8E93">macOS 15+  ·  Swift 6.2  ·  SwiftUI + AppKit  ·  MIT</text>

    <!-- snap marker motif -->
    <g transform="translate(0 360)">
      <path d="M0 8 L 0 0 M0 8 L 8 8" stroke="#B58A5F" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      <text x="18" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#A1A1A6">SNAP · 拖拽吸附</text>
    </g>
  </g>

  <!-- RIGHT: floating window, close to real UI -->
  <g transform="translate(742 44)" filter="url(#panel-shadow)">
    <rect x="0" y="0" width="380" height="320" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>

    <!-- tab bar -->
    <g transform="translate(20 16)">
      <rect x="0" y="0" width="124" height="32" rx="16" fill="#F2F2F2"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">待办</text>
      <text x="84" y="22" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#8E8E93">日记</text>
    </g>

    <!-- window controls / icons (right) -->
    <g transform="translate(310 24)" stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M0 4 L8 4 M4 0 L4 8"/>
      <path d="M22 2 A6 6 0 1 1 16 7" transform="translate(14 -2)"/>
      <polyline points="50,2 56,8 62,2" transform="translate(18 -3)"/>
    </g>

    <!-- date navigator -->
    <g transform="translate(20 64)">
      <path d="M6 0 L0 8 L6 16" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M58 0 L64 8 L58 16" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="14" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">8月10日</text>
    </g>

    <!-- pomodoro card -->
    <g transform="translate(20 96)">
      <rect x="0" y="0" width="340" height="104" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <!-- ring -->
      <circle cx="44" cy="52" r="34" fill="none" stroke="#EFE9E2" stroke-width="7"/>
      <circle cx="44" cy="52" r="34" fill="none" stroke="#B58A5F" stroke-width="7" stroke-linecap="round" stroke-dasharray="160 213"/>
      <text x="44" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">24:55</text>
      <!-- title -->
      <text x="96" y="40" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#1C1C1E">阅读</text>
      <text x="96" y="62" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#8E8E93">专注中 · 本轮 25 分钟</text>
      <!-- buttons -->
      <rect x="96" y="74" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="122" y="90" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#3A3A3C" text-anchor="middle">放弃</text>
      <rect x="156" y="74" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="182" y="90" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#3A3A3C" text-anchor="middle">暂停</text>
      <rect x="216" y="74" width="52" height="24" rx="12" fill="#4CAF50"/>
      <text x="242" y="90" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">完成</text>
    </g>

    <!-- task row 1 -->
    <g transform="translate(20 216)">
      <circle cx="14" cy="14" r="10" fill="none" stroke="#C7C7CC" stroke-width="1.6"/>
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">读书</text>
      <g transform="translate(38 24)">
        <rect x="0" y="0" width="58" height="20" rx="10" fill="#FFF5E6"/>
        <circle cx="14" cy="10" r="3" fill="none" stroke="#B58A5F" stroke-width="1.4"/>
        <path d="M14 7 L14 10 L16 11.5" fill="none" stroke="#B58A5F" stroke-width="1.2" stroke-linecap="round"/>
        <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#B58A5F">1 分钟</text>
      </g>
      <text x="108" y="38" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#8E8E93">已同步</text>
      <text x="270" y="26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#C7C7CC">计时</text>
      <circle cx="326" cy="14" r="2.2" fill="#C7C7CC"/>
      <circle cx="334" cy="14" r="2.2" fill="#C7C7CC"/>
      <circle cx="342" cy="14" r="2.2" fill="#C7C7CC"/>
    </g>

    <!-- task row 2 -->
    <g transform="translate(20 270)">
      <circle cx="14" cy="14" r="10" fill="none" stroke="#C7C7CC" stroke-width="1.6"/>
      <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">阅读</text>
      <g transform="translate(38 24)">
        <rect x="0" y="0" width="64" height="20" rx="10" fill="#FFF5E6"/>
        <circle cx="14" cy="10" r="3" fill="none" stroke="#B58A5F" stroke-width="1.4"/>
        <path d="M14 7 L14 10 L16 11.5" fill="none" stroke="#B58A5F" stroke-width="1.2" stroke-linecap="round"/>
        <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#B58A5F">50 分钟</text>
      </g>
      <text x="114" y="38" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#8E8E93">已同步</text>
      <text x="270" y="26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#C7C7CC">计时</text>
      <circle cx="326" cy="14" r="2.2" fill="#C7C7CC"/>
      <circle cx="334" cy="14" r="2.2" fill="#C7C7CC"/>
      <circle cx="342" cy="14" r="2.2" fill="#C7C7CC"/>
    </g>
  </g>
</svg>
