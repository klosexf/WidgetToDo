<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="af-title af-desc">
  <title id="af-title">WidgetToDo 分层架构：UI 层 → NotionRepository → NotionClient / SQLiteCache / KeychainTokenStore / SettingsStore</title>
  <desc id="af-desc">三列分层图：左列为 View 与 ViewModel，中列为 NotionRepository，右列为四个基础设施组件。箭头表示调用方向。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E87A5D"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6671"/>
    </marker>
  </defs>

  <rect width="1200" height="280" rx="20" fill="#0E0F12"/>

  <!-- Column headers -->
  <text x="56" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8" fill="#5F6671">UI 层 · VIEWS &amp; VIEWMODELS</text>
  <text x="448" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8" fill="#5F6671">领域层 · REPOSITORY</text>
  <text x="824" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8" fill="#5F6671">基础设施 · INFRASTRUCTURE</text>

  <!-- Column 1: UI -->
  <g transform="translate(56 60)">
    <rect x="0" y="0" width="320" height="180" rx="12" fill="#171A21" stroke="#2A2E36" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">ContentView</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">TodoListViewModel</text>
    <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">JournalViewModel</text>
    <text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">NewTaskFormCard</text>
  </g>

  <!-- Column 2: Repository -->
  <g transform="translate(448 110)">
    <rect x="0" y="0" width="256" height="80" rx="12" fill="#171A21" stroke="#E87A5D" stroke-width="1.2"/>
    <text x="128" y="38" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#F2F3F5" text-anchor="middle">NotionRepository</text>
    <text x="128" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#8B919A" text-anchor="middle">唯一入口 · single gateway</text>
  </g>

  <!-- Column 3: Infrastructure -->
  <g transform="translate(824 60)">
    <rect x="0" y="0" width="320" height="180" rx="12" fill="#171A21" stroke="#2A2E36" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">NotionClient</text>
    <text x="200" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5F6671">HTTPS</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">SQLiteCache</text>
    <text x="200" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5F6671">offline</text>
    <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">KeychainTokenStore</text>
    <text x="240" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5F6671">token</text>
    <text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#F2F3F5">SettingsStore</text>
    <text x="200" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5F6671">config</text>
  </g>

  <!-- Arrows: UI -> Repository -->
  <line x1="376" y1="150" x2="442" y2="150" stroke="#E87A5D" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="409" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8B919A" text-anchor="middle">调用</text>

  <!-- Arrows: Repository -> Infrastructure -->
  <line x1="704" y1="150" x2="818" y2="150" stroke="#E87A5D" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="761" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8B919A" text-anchor="middle">委托</text>

  <!-- Forbidden backflow marker -->
  <line x1="818" y1="200" x2="704" y2="200" stroke="#3A3F4A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
  <text x="761" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5F6671" text-anchor="middle">UI 不直连 · forbidden</text>

  <!-- bottom motif: snap marker -->
  <g transform="translate(56 256)">
    <path d="M0 0 L 0 -8 M0 0 L 8 0" stroke="#E87A5D" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <text x="16" y="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1" fill="#5F6671">分层约束 · layering contract</text>
  </g>
</svg>
